<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fintech — فيديو ترويجي (عربي)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;900&display=swap"
    rel="stylesheet"
  />
  <style>
    @font-face {
      font-family: 'Montserrat';
      src: url('fonts/Montserrat-VariableFont_wght.ttf') format('truetype-variations'),
           url('fonts/Montserrat-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Montserrat';
      src: url('fonts/Montserrat-Italic-VariableFont_wght.ttf') format('truetype-variations'),
           url('fonts/Montserrat-Italic-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: italic;
      font-display: swap;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #050505;
      overflow: hidden;
      font-family: 'Noto Sans Arabic', 'Montserrat', sans-serif;
    }
    #root { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Animation engine + scene library -->
  <script type="text/babel" src="promo/animations.jsx"></script>
  <script type="text/babel" src="promo/scenes.jsx"></script>

  <script type="text/babel">
    const LANG = 'ar';
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <Stage
        width={1080}
        height={1080}
        duration={30}
        background="#0A0A0A"
        loop={true}
        autoplay={true}
        persistKey="fintech-promo-ar"
      >
        <FintechPromo lang={LANG} />
      </Stage>
    );
  </script>
</body>
</html>
